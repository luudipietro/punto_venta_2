server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: any non-file route falls back to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API — trailing slash on proxy_pass strips the /api/ prefix,
    # since the FastAPI routes themselves are mounted at the root (/sales,
    # /products, ...), not under /api.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded product/logo images, served by the backend's StaticFiles mount
    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
    }
}
