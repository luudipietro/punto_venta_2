services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-pos}
    volumes:
      - pos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pos}
      SECRET_KEY: ${SECRET_KEY:?set a real SECRET_KEY in .env.prod}
      # STOREFRONT_DOMAIN is optional — only set it once the public storefront
      # gets its own subdomain (see the `storefront` service below); an unset
      # value just adds a harmless "https://" entry that matches no real origin.
      CORS_ORIGINS: '["https://${DOMAIN}", "http://${SERVER_IP:-localhost}", "https://${STOREFRONT_DOMAIN:-}"]'
    volumes:
      - pos_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend

  # Public customer-facing catalog (storefront/) — a separate app/subdomain
  # from the admin frontend above, no login. Optional: only relevant once
  # STOREFRONT_PORT/STOREFRONT_DOMAIN are set up for this client.
  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STOREFRONT_PORT:-8091}:80"
    depends_on:
      - backend

volumes:
  pos_postgres_data:
  pos_media:
